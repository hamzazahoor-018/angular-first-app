<h1>Hello, World!</h1>

<app-login></app-login>

<app-signup></app-signup>

<button (click)="handleClick()">Click Me</button>


<div (click)="handleEvent($event)" style = "margin: 10px; width: 200px; height: 50px; background-color: lightblue;"></div>

<div
  (click)="handleEvent($event)"
  (mouseenter)="handleEvent($event)"
  (mouseleave)="handleEvent($event)"
    style = "margin: 10px; width: 200px; height: 50px; background-color: orangered;"
  >
</div>


<input type="text" (input)="handleEvent($event)"
 (focus)="handleEvent($event)" 
 (blur)="handleEvent($event)"
 placeholder="Type something..." />


<br/>
<br>

<button (click)="toggleTwo()">{{ toggle ? 'Hide' : 'Show' }}</button>
 <br>

@if (toggle) {
    <!-- Content to show when toggle is true -->
    <div style="width: 100px; height: 100px; background-color: lightcoral;"></div>
} 
@else {
    <!-- Content to show when toggle is false -->
  <div style="width: 100px; height: 100px; background-color: lightgreen;"></div>
}



<input type="text" (input)="handleColorChange($event)" placeholder="Enter your color">

@if(color === 1) {
  <div style="width: 100px; height: 100px; background-color: lightgray;"></div>
} @else if(color === 2) {
  <div style="width: 100px; height: 100px; background-color: lightyellow;"></div>
} @else if(color === 3) {
  <div style="width: 100px; height: 100px; background-color: lightblue;"></div>
} @else {
  <div style="width: 100px; height: 100px; background-color: lightpink;"></div>
}



<app-test></app-test>
